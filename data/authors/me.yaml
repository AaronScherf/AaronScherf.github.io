bio: |
  Aaron (they/them) is a first-year PhD student in Sustainable Development at Columbia University, researching how high-resolution geospatial data and machine learning can help explain climate and conflict shocks in vulnerable communities. That work builds directly on over five years as a USAID diplomat — most recently leading monitoring and evaluation for USAID/Ukraine's development portfolio through the war, and previously managing program design in Colombia and program/budget analysis in Washington and South Africa — as well as a Fulbright Scholarship conducting labor economics research in Germany. Their academic background includes an MS in Computer Science from Georgia Tech, an MS in Mathematics from Indiana State University, and an MS in Development Practice from UC Berkeley.

